[SiteControl]
# MES 校验接口地址
Endpoint=http://192.168.200.30:8001/api/cable/handleSiteControl
# 本机站点编码
MySite=FDL

[Modbus]
Endpoint=192.168.1.10
BigEndian=true

[Report]
# 硬件上传原始数据的目录
WatchCsvDir=D:\MESDATA
# 每个产品条码的样品数（报告表格的数据行数）
SampleCount=4
# 每个样品的重复次数（每个样品对应的 CSV 数）
# 一个产品的 CSV 总数 = SampleCount * RepeatCount，报告里的图表数也是这个数
# 每个样品的第 1 次 repeat 不参与结果判定，后续 repeat 里最小的浮动力和上下限比较
RepeatCount=3
# 存放 OK 报告的目录
OkDir=D:\MESDATA\OK\
# 存放 NG 报告的目录
NgDir=D:\MESDATA\NG\
# 每个样品使用的上下限组索引（逗号分隔，按样品顺序；索引对应 [LimitGroups:0]、[LimitGroups:1] ...）
LimitGroupMap=0,1,1,0

[LimitGroups:0]
# 起始浮动力下限
InitialLowerLimit=
# 起始浮动力上限
InitialUpperLimit=
# 最终浮动力下限
FinalLowerLimit=
# 最终浮动力上限
FinalUpperLimit=

[LimitGroups:1]
# 起始浮动力下限
InitialLowerLimit=
# 起始浮动力上限
InitialUpperLimit=
# 最终浮动力下限
FinalLowerLimit=
# 最终浮动力上限
FinalUpperLimit=
